     <h1>人工知能が社会に与える影響</h1>

     <p>著者：山田太郎</p>

     <h2>第1章 はじめに</h2>
  
     <p>近年、人工知能技術の急速な発展により、社会のさまざまな分野でAIの活用が進んでいる。</p>
<h2>第2章 AIの影響</h2>
<ul>
    <li>雇用への影響</li>
    <li>教育への影響</li>
    <li>プライバシーへの影響</li>
</ul>
<h2>第3章 結論</h2>
<p>AIの発展は社会に大きな変革をもたらす可能性がある。</p>
