<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS演習</title>
    <!-- style.css を定義してみよう -->
     <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>CSSを学ぼう！</h1>
    
    <h2>1. HTMLタグでセレクト</h2>
    <p>これは段落です。pタグを使ってスタイルを適用してみましょう。</p>
    <ul>
        <li>リストアイテム1</li>
        <li>リストアイテム2</li>
        <li>リストアイテム3</li>
    </ul>

    <h2>2. クラスでセレクト</h2>
    <div class="box">
        これは「box」クラスを持つdivです。
    </div>
    <p class="bold">これは「bold」クラスを持つ段落です。</p>

    <h2>3. IDでセレクト（サンプル）</h2>
    <div id="unique-box">
        これは「unique-box」というIDを持つdivです。
    </div>

    <h2>4. いろんなCSS適用してみよう！</h2>
    <div class="playground">
        ここで自由にCSSを試してみましょう。
    </div>

    <a href="https://example.com">サンプルリンク</a>
</body>
</html>
