<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>たい焼き16タイプ性格診断</title>
    
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="app-container">
            <img src="./image/tai_shisho.jpeg" alt="たい師匠" class="top-character">
            
            <h1>たい焼き16タイプ性格診断</h1>

            <div class="question-box">
                <label>Q1. どこから食べると〜？</label>
                <select id="q1">
                    <option value="" disabled selected>ここから選ぶっタイ！</option>
                    <option value="head">頭から</option>
                    <option value="stomach">お腹から</option>
                    <option value="tail">尻尾から</option>
                    <option value="fin">背びれから</option>
                </select>
            </div>

            <div class="question-box">
                <label>Q2. その理由はなんね？</label>
                <select id="q2">
                    <option value="" disabled selected>ここから選ぶっタイ！</option>
                    <option value="instinct">すぐ味わいタイ！</option>
                    <option value="caution">後に残しタイ！</option>
                    <option value="rational">食べやすいっタイ！</option>
                    <option value="sense">食感が好きっタイ！）</option>
                </select>
            </div>

                    <button class="btn-diagnose" id="btn-diagnose">診断するっタイ！</button>

                    <div id="result-area">
                        <img src="./image/tai_shisho.jpeg" alt="たい師匠" id="result-img" class="character-icon">
                    
                        <div class="speech-bubble" id="result-text">
                        </div>
                    </div>
        </div>

        <script src="data.js"></script>

                <script>
                    $(document).ready(function() {
                        // ② resultData の定義はここから削除（data.jsから読み込まれます）
                        
                        $('#btn-diagnose').on('click', function() {
                            const q1Value = $('#q1').val();
                            const q2Value = $('#q2').val();

                            /*アラート*/
                            if (!q1Value || !q2Value) {
                                alert("質問を2つとも選んでほしいタイ！");
                                return;
                            } 

                            // data.js にある resultData がここでそのまま使えます
                            const resultText = resultData[q1Value][q2Value];
                            $('#result-text').html(resultText);
                            const images = [
                                "./image/rock.jpeg",
                                "./image/okinawa.jpeg",
                                "./image/mentai.jpeg",
                                "./image/osaka.jpeg",
                                "./image/tokyo.jpeg",
                                "./image/fukuoka.jpeg",
                                "./image/hokaido.jpeg"
                            ];
                            
                            /*ランダム*/
                            const randomIndex = Math.floor(Math.random() * images.length);
                            $('#result-img').attr('src', images[randomIndex]);
                            
                            $('#result-area').css('display', 'flex').hide().fadeIn(500);
                        }); 
                    }); 
                </script>


    </body>
</html>
