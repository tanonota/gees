<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>たい焼き16タイプ性格診断</title>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="app-container">
            <img src="./image/tai_shisho.jpeg" alt="たい師匠" class="top-character">
            
            <h1>たい焼き16タイプ性格診断</h1>

            <div class="question-box">
                <label>Q1. どこから食べると〜？</label>
                <select id="q1">
                    <option value="" disabled selected>ここから選ぶっタイ！</option>
                    <option value="head">頭から</option>
                    <option value="stomach">お腹から</option>
                    <option value="tail">尻尾から</option>
                    <option value="fin">背びれから</option>
                </select>
            </div>

            <div class="question-box">
                <label>Q2. その理由はなんね？</label>
                <select id="q2">
                    <option value="" disabled selected>ここから選ぶっタイ！</option>
                    <option value="instinct">すぐ味わいタイ！</option>
                    <option value="caution">後に残しタイ！</option>
                    <option value="rational">食べやすいっタイ！</option>
                    <option value="sense">食感が好きっタイ！）</option>
                </select>
            </div>

                    <button class="btn-diagnose" id="btn-diagnose">診断するっタイ！</button>

                    <div id="result-area">
                        <img src="./image/tai_shisho.jpeg" alt="たい師匠" id="result-img" class="character-icon">
                    
                        <div class="speech-bubble" id="result-text">
                        </div>
                    </div>
        </div>

        <script>
           
            $(document).ready(function() {

                        rational: "尻尾を持つのが一番手が汚れない！という理由で頭から食べるキミは【無駄を嫌うスマートな合理主義者】ッタイ！物事の一番スムーズな進め方を一瞬で見抜く天才だギョ！感情に流されず、常に『どうすれば一番効率が良いか』を考えられるから、仕事でも頼りにされるはずッタイ。",
                        sense: "頭からガブッといきたい！という衝動に従うキミは【情熱的な感覚派アーティスト】ッタイ！『なんかイイ感じ！』という直感やフィーリングを誰よりも大切にしているギョ！豪快で感性豊か、型にはまらない自由な発想を持っているッタイ。自分の心のコンパスに従って、思い切り泳ぎ続けるッタイ！"
                    },
                    stomach: {
                        instinct: "一番あんこが詰まったお腹のど真ん中からいくキミは【欲求に素直なマイペースさん】ッタイ！物事の『一番おいしいところ』を無意識に察知して、スッと独占できちゃう天性の愛されキャラだギョ！自分の気持ちに嘘をつけないから、たまにワガママに見えることもあるけど、その無邪気さが憎めんッタイ。",
                        caution: "カリカリの端っこを最後に残すため、柔らかいお腹から食べるキミは【周りが見える気配り上手】ッタイ！波風を立てず、周囲との調和を何より大切にする平和主義者だギョ。真ん中から手をつけることで全体を見渡し、どうすれば丸く収まるかを常に考えているッタイ。",
                        rational: "横からあんこがはみ出ないように計算してお腹から食べるキミは【リスク管理のプロフェッショナル】ッタイ！トラブルを未然に防ぐ能力がピカイチで、石橋を叩きまくって渡る慎重派だギョ！想定外の事態が起きても、キミがいれば被害は最小限に食い止められるはずッタイ。",
                        sense: "お腹のふっくらした柔らかい食感が大好きでそこから食べるキミは【穏やかな癒やし系】ッタイ！温かさや安心感を求めていて、一緒にいる人にホッとする時間を提供できる包容力の持ち主だギョ。キミのそのふんわりした優しさは、疲れた現代社会にとって最高のオアシスになっているはずッタイ！"
                    },
                    tail: {
                        instinct: "尻尾のカリカリ感がたまらなく好きで尻尾からいくキミは【個性が光るオンリーワン気質】ッタイ！世間の『普通』や『王道』には目もくれず、自分の『好き』を貫く芯の強さがあるギョ！流行に流されない確固たる美学を持っているから、周りからはちょっと個性的だと思われることも。そのブレない姿勢が最大の武器ッタイ。",
                        caution: "あんこたっぷりの部分をメインディッシュに残すキミは【大器晩成の努力家】ッタイ！『最後の大成功』のためなら、最初は少し味気ない下積みだって笑顔で耐えられちゃう我慢強さがあるギョ！最後に極上のあんこが待っていると信じて努力を続ければ、必ず大きな花を開かせるタイプッタイ！",
                        rational: "尻尾の方が冷めやすくて火傷しないから、という理由のキミは【冷静沈着なアナリスト】ッタイ！感情に振り回されず、常に状況を観察して一番安全で最適な行動をとれるギョ。一見クールに見えるけど、実は誰よりも周りの状況が見えているッタイ。",
                        sense: "カリカリからモチモチへ、食感の変化を楽しみたいキミは【ストーリーを愛する演出家】ッタイ！物事の『結果』だけじゃなく、『過程』や『変化』に喜びを見出せる、豊かな感受性の持ち主だギョ！何気ない日常の中にも小さなドラマや楽しみを見つける天才ッタイ。"
                    },
                    fin: {
                        instinct: "なんとなく、気分で背中からかじっちゃうキミは【自由奔放なトリックスター】ッタイ！型にハマるのが大の苦手で、思いつきとひらめきで生きているギョ！突然突拍子もないことを始めて周りをハラハラさせることもあるけど、その予測不能な行動がなぜか憎めない魅力ッタイ。",
                        caution: "周りの生地から食べて、あんこを最後まで残したいキミは【ストイックな完璧主義者】ッタイ！外堀からじわじわと確実に埋めていき、最後に核心に迫るタイプだギョ！物事を進める際のこだわりが異常に強く、絶対に妥協を許さない職人気質ッタイ。",
                        rational: "背中からパカッと割って、半分にして食べたいキミは【公平性を重んじるバランサー】ッタイ！全体を俯瞰して把握し、みんなで分け合ったり、人間関係のバランスを取ったりするのが絶妙に上手いギョ！喧嘩の仲裁や、チームの調整役にはうってつけの存在ッタイ。",
                        sense: "背中の生地の厚みや弾力がたまらない！と熱く語るキミは【独自の美学を持つマニア】ッタイ！普通の人なら全く気にしないようなマニアックな部分に価値を見出せる、筋金入りのオタク気質だギョ！一度何かにハマると、寝食を忘れてとことん極めないと気が済まないッタイ。"
                    }
                };
        
               
                $('#btn-diagnose').on('click', function() {
                        
                    const q1Value = $('#q1').val();
                    const q2Value = $('#q2').val();
        
                /*アラート*/
                    if (!q1Value || !q2Value) {
                        alert("質問を2つとも選んでほしいタイ！");
                        return;
                    } 
        
                    
                    const resultText = resultData[q1Value][q2Value];
                    $('#result-text').html(resultText);
        
                    
                    const images = [
                        "./image/rock.jpeg",
                        "./image/okinawa.jpeg",
                        "./image/mentai.jpeg",
                        "./image/osaka.jpeg",
                        "./image/tokyo.jpeg",
                        "./image/fukuoka.jpeg",
                        "./image/hokaido.jpeg"
                    ];
                /*ランダム*/
                    const randomIndex = Math.floor(Math.random() * images.length);
                    $('#result-img').attr('src', images[randomIndex]);
                    
                    
                    $('#result-area').css('display', 'flex').hide().fadeIn(500);
        
                }); 
        
            }); 
        </script>

    </body>
</html>
